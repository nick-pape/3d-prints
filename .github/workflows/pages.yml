name: Deploy Pages (generators)

on:
  push:
    branches: [main]
    paths: [pages/**, powerbank-station/site/**, powerbank-station/tools/build_site.py, powerbank-station/tools/petg_hf06.ini, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Geometry check (every size builds as a closed solid)
        working-directory: powerbank-station/site
        run: npm ci && node test_node.mjs
      - name: Assemble _site (landing page + powerbank-station/)
        run: |
          mkdir -p _site && cp pages/* _site/ && touch _site/.nojekyll
          python powerbank-station/tools/build_site.py _site/powerbank-station
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
